[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veltrix-engine"
version = "0.1.0"
description = "Veltrix Data telemetry and vehicle-performance analysis engine (Python reference implementation)"
requires-python = ">=3.10"
authors = [{ name = "Utkarsh Chaudhari" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
